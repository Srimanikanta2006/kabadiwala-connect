name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON Schemas
        run: |
          python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('shared/**/*.json', recursive=True)]"
          echo "All shared JSON schemas and taxonomies are valid."

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Documentation & Design System
        run: |
          test -f README.md
          test -f stitch-designs/design-system.md
          test -f shared/taxonomy/material_taxonomy.json
          echo "Core verification passed."
